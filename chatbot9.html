<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Krishna's Flute - Premium Chat</title>
<script src="https://cdn.tailwindcss.com"></script>
<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
/>
<style>
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #1e1e2d, #2a2a3a);
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 1rem;
  }
  .chat-container {
    background: #1f1f2e;
    border-radius: 12px;
    width: 100%;
    max-width: 700px;
    height: 90vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 40px rgba(0,0,0,0.4);
  }
  .chat-header {
    padding: 1rem 1.5rem;
    background: linear-gradient(90deg, #2c2c44, #1a1a2e);
    color: #a78bfa;
    font-weight: 700;
    font-size: 1.25rem;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    border-bottom: 1px solid #3b3b5a;
  }
  .chat-header i {
    font-size: 1.8rem;
  }
  #chatMessages {
    flex: 1;
    overflow-y: auto;
    padding: 1rem 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    scroll-behavior: smooth;
  }
  .message {
    max-width: 75%;
    padding: 1rem 1.25rem;
    border-radius: 16px;
    position: relative;
    white-space: pre-wrap;
    word-wrap: break-word;
    font-size: 1rem;
    line-height: 1.4;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  .message.user {
    background: linear-gradient(90deg, #6b21a8, #a78bfa);
    color: white;
    align-self: flex-end;
    border-bottom-right-radius: 0;
  }
  .message.bot {
    background: #2a2a3a;
    color: #d8b4fe;
    align-self: flex-start;
    border-bottom-left-radius: 0;
    border: 1px solid #8b5cf6;
  }
  .message .header {
    font-weight: 600;
    font-size: 0.85rem;
    margin-bottom: 0.5rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    color: #a78bfa;
  }
  .message .header i {
    font-size: 1rem;
  }
  .message-content {
    min-height: 1.2em;
  }
  .message-content code {
    background: rgba(139, 92, 246, 0.15);
    padding: 0.15em 0.3em;
    border-radius: 4px;
    font-family: 'Courier New', monospace;
    font-size: 0.95em;
  }
  .message-content pre {
    background: #1e1e2d;
    padding: 0.75rem;
    border-radius: 8px;
    overflow-x: auto;
    margin-top: 0.5rem;
    border-left: 4px solid #8b5cf6;
    font-family: 'Courier New', monospace;
    font-size: 0.9rem;
  }
  .typing-indicator {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding-left: 1.5rem;
    color: #a78bfa;
    font-style: italic;
    font-size: 0.9rem;
  }
  .typing-indicator span.dot {
    width: 8px;
    height: 8px;
    background: #8b5cf6;
    border-radius: 50%;
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing-indicator span.dot:nth-child(1) {
    animation-delay: 0s;
  }
  .typing-indicator span.dot:nth-child(2) {
    animation-delay: 0.2s;
  }
  .typing-indicator span.dot:nth-child(3) {
    animation-delay: 0.4s;
  }
  @keyframes bounce {
    0%, 80%, 100% {
      transform: translateY(0);
    }
    40% {
      transform: translateY(-8px);
    }
  }
  .input-area {
    display: flex;
    gap: 0.75rem;
    padding: 1rem 1.5rem;
    border-top: 1px solid #3b3b5a;
    background: #1f1f2e;
  }
  .input-area input[type="text"] {
    flex: 1;
    background: #2a2a3a;
    border: none;
    border-radius: 9999px;
    padding: 0.75rem 1rem;
    color: white;
    font-size: 1rem;
    outline-offset: 2px;
    transition: outline-color 0.2s ease;
  }
  .input-area input[type="text"]::placeholder {
    color: #9ca3af;
  }
  .input-area input[type="text"]:focus {
    outline: 2px solid #8b5cf6;
    background: #3b3b5a;
  }
  .input-area button {
    background: linear-gradient(45deg, #8b5cf6, #a78bfa);
    border: none;
    border-radius: 9999px;
    width: 44px;
    height: 44px;
    color: white;
    font-size: 1.2rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: box-shadow 0.3s ease, transform 0.2s ease;
  }
  .input-area button:hover:not(:disabled) {
    box-shadow: 0 0 10px rgba(139, 92, 246, 0.7);
    transform: scale(1.1);
  }
  .input-area button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    box-shadow: none;
    transform: none;
  }
  @media (max-width: 640px) {
    .chat-container {
      height: 100vh;
      border-radius: 0;
    }
    .chat-header {
      padding: 1rem;
    }
    .input-area {
      padding: 1rem;
    }
  }
</style>
</head>
<body>
  <main class="chat-container" role="main" aria-label="Krishna's Flute Chat">
    <header class="chat-header">
      <i class="fas fa-music" aria-hidden="true"></i>
      <h1>Krsna's Flute</h1>
    </header>

    <section id="chatMessages" aria-live="polite" aria-relevant="additions" tabindex="0"></section>

    <div id="typingIndicator" class="typing-indicator" aria-hidden="true" style="display:none;">
      <span>Krishna's Flute is typing</span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>

    <form id="inputForm" class="input-area" aria-label="Send message form">
      <input
        type="text"
        id="userInput"
        name="userInput"
        placeholder="Play your query like Krishna's flute..."
        autocomplete="off"
        aria-required="true"
        maxlength="2000"
      />
      <button type="button" id="voiceBtn" aria-label="Start voice input" title="Voice input">
        <i class="fas fa-microphone"></i>
      </button>
      <button type="submit" id="sendBtn" aria-label="Send message" title="Send message">
        <i class="fas fa-paper-plane"></i>
      </button>
    </form>
  </main>

  <script>
    (() => {
      const chatMessages = document.getElementById('chatMessages');
      const userInput = document.getElementById('userInput');
      const sendBtn = document.getElementById('sendBtn');
      const voiceBtn = document.getElementById('voiceBtn');
      const typingIndicator = document.getElementById('typingIndicator');
      const inputForm = document.getElementById('inputForm');

      const API_ENDPOINT = 'https://openrouter.ai/api/v1/chat/completions';
      const API_KEY = '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';

      // Voice recognition setup
      let recognition;
      if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = false;

        recognition.onresult = (event) => {
          const transcript = event.results[0][0].transcript;
          userInput.value = transcript;
          userInput.focus();
          voiceBtn.classList.remove('text-red-500');
        };

        recognition.onerror = (event) => {
          console.error('Voice recognition error:', event.error);
          voiceBtn.classList.remove('text-red-500');
        };

        recognition.onend = () => {
          voiceBtn.classList.remove('text-red-500');
        };

        voiceBtn.addEventListener('click', () => {
          if (!voiceBtn.classList.contains('text-red-500')) {
            recognition.start();
            voiceBtn.classList.add('text-red-500');
          }
        });
      } else {
        voiceBtn.disabled = true;
        voiceBtn.title = 'Voice input not supported';
      }

      // Escape HTML to prevent injection
      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML.replace(/\n/g, '<br>');
      }

      // Scroll chat to bottom
      function scrollToBottom() {
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }

      // Add message with typing animation for bot
      async function addBotMessage(text) {
        const messageEl = document.createElement('article');
        messageEl.classList.add('message', 'bot');
        messageEl.setAttribute('role', 'article');
        messageEl.setAttribute('aria-label', "Krishna's Flute message");

        const header = document.createElement('div');
        header.className = 'header';
        header.innerHTML = '<i class="fas fa-robot"></i> Krishna\'s Flute';
        messageEl.appendChild(header);

        const content = document.createElement('div');
        content.className = 'message-content';
        messageEl.appendChild(content);

        chatMessages.appendChild(messageEl);
        scrollToBottom();

        // Typewriter effect
        for (let i = 0; i < text.length; i++) {
          content.innerHTML += escapeHtml(text.charAt(i));
          scrollToBottom();
          await new Promise((r) => setTimeout(r, 15 + Math.random() * 15));
        }
      }

      // Add user message instantly
      function addUserMessage(text) {
        const messageEl = document.createElement('article');
        messageEl.classList.add('message', 'user');
        messageEl.setAttribute('role', 'article');
        messageEl.setAttribute('aria-label', 'User message');
        messageEl.textContent = text;
        chatMessages.appendChild(messageEl);
        scrollToBottom();
      }

      // Show/hide typing indicator
      function setTyping(isTyping) {
        typingIndicator.style.display = isTyping ? 'flex' : 'none';
      }

      // Send message to API
      async function sendMessage(message) {
        if (!message.trim()) return;
        addUserMessage(message);
        setTyping(true);

        try {
          const response = await fetch(API_ENDPOINT, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              Authorization: `Bearer ${API_KEY}`,
            },
            body: JSON.stringify({
              model: 'openai/gpt-3.5-turbo',
              messages: [{ role: 'user', content: message }],
              max_tokens: 150,
              temperature: 0.7,
            }),
          });

          if (!response.ok) {
            throw new Error(`API error: ${response.statusText}`);
          }

          const data = await response.json();
          const botMessage = data.choices?.[0]?.message?.content || "I'm sorry, I couldn't understand that.";
          await addBotMessage(botMessage);
        } catch (error) {
          console.error(error);
          await addBotMessage('Sorry, something went wrong. Please try again later.');
        } finally {
          setTyping(false);
        }
      }

      // Form submit handler
      inputForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const message = userInput.value;
        userInput.value = '';
        sendMessage(message);
      });

      // Initial welcome message
      addBotMessage("Hello! I'm Krsna's Flute - your AI assistant. How can I help you today?");
    })();
  </script>
</body>
</html>
